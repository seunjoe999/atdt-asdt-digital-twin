name: Keep Render backends warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping ATDT backend
        run: curl -sS -m 30 -o /dev/null -w "atdt-backend: %{http_code}\n" https://atdt-backend.onrender.com/health || true
      - name: Ping ASDT backend
        run: curl -sS -m 30 -o /dev/null -w "asdt-backend: %{http_code}\n" https://asdt-backend.onrender.com/health || true
