services:
  - type: web
    name: atdt-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # sync: false means Render never overwrites this from the blueprint on
      # deploy -- it's managed by hand in the dashboard (set to a persistent
      # Postgres URL). Without this, every git-triggered deploy silently
      # resets it back to the sqlite value below, wiping all data.
      - key: DATABASE_URL
        sync: false
      - key: CHROMA_DIR
        value: ./chroma_data
      - key: JWT_SECRET
        generateValue: true
      - key: DT_LLM__PROVIDER
        value: offline
      - key: PYTHON_VERSION
        value: 3.11.9

  - type: web
    name: asdt-backend
    runtime: python
    plan: free
    rootDir: asdt/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # sync: false -- see the atdt-backend service above for why.
      - key: DATABASE_URL
        sync: false
      # Render assigns this URL from the service name above; if "atdt-backend"
      # is already taken globally on onrender.com, Render will suffix it and
      # you'll need to update this value to match after the first deploy.
      - key: ATDT_BASE_URL
        value: https://atdt-backend.onrender.com
      - key: GAP_THRESHOLD
        value: "0.6"
      - key: PYTHON_VERSION
        value: 3.11.9
