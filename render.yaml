services:
  - type: web
    name: atdt-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./atdt.db
      - key: CHROMA_DIR
        value: ./chroma_data
      - key: JWT_SECRET
        generateValue: true
      - key: DT_LLM__PROVIDER
        value: offline
      - key: PYTHON_VERSION
        value: 3.11.9

  - type: web
    name: asdt-backend
    runtime: python
    plan: free
    rootDir: asdt/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./asdt.db
      # Render assigns this URL from the service name above; if "atdt-backend"
      # is already taken globally on onrender.com, Render will suffix it and
      # you'll need to update this value to match after the first deploy.
      - key: ATDT_BASE_URL
        value: https://atdt-backend.onrender.com
      - key: GAP_THRESHOLD
        value: "0.6"
      - key: PYTHON_VERSION
        value: 3.11.9
